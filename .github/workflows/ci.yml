name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  # NOTE: the job id below ("test") is what scripts/setup-branch-protection.sh
  # registers as a required status check context. If GitHub reports it in the
  # Checks tab under a different label than "test" once this first runs
  # (it can be prefixed with the workflow name depending on your repo's
  # settings), update the context string in that script to match exactly.
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-key: forge-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}

      - name: Install
        run: pnpm install --frozen-lockfile || (pnpm install --no-frozen-lockfile && git diff pnpm-lock.yaml | head -100)

      - name: Lint
        run: pnpm lint

      - name: Dependency rule check
        run: pnpm dep-check

      - name: Clean build artifacts
        run: pnpm --filter @forge/contracts run clean 2>/dev/null || true && pnpm --filter @forge/core run clean 2>/dev/null || true && pnpm --filter @forge/adapters run clean 2>/dev/null || true && pnpm --filter @forge/cli run clean 2>/dev/null || true

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
