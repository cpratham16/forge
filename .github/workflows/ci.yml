name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-key: forge-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}

      - name: Install
        run: pnpm install --frozen-lockfile || (pnpm install --no-frozen-lockfile && git diff pnpm-lock.yaml | head -100)

      - name: Lint
        run: pnpm lint

      - name: Dependency rule check
        run: pnpm dep-check

      - name: Clean build artifacts
        run: |
          echo "Cleaning build artifacts..."
          pnpm --filter @forge/contracts run clean 2>/dev/null || true
          pnpm --filter @forge/core run clean 2>/dev/null || true
          pnpm --filter @forge/adapters run clean 2>/dev/null || true
          pnpm --filter @forge/cli run clean 2>/dev/null || true
          echo "Clean completed. Checking dist folders:"
          ls -la packages/contracts/dist/ 2>/dev/null || echo "contracts/dist not found"
          ls -la packages/core/dist/ 2>/dev/null || echo "core/dist not found"
          ls -la packages/adapters/dist/ 2>/dev/null || echo "adapters/dist not found"
          ls -la packages/cli/dist/ 2>/dev/null || echo "cli/dist not found"

      - name: Build contracts
        run: |
          echo "=== Building contracts package ==="
          pnpm --filter @forge/contracts run build
          echo "Exit code: $?"
          ls -la packages/contracts/dist/ || echo "DIST NOT FOUND"
          cat packages/contracts/dist/index.d.ts 2>/dev/null | grep -A 5 "ModelCapability" || echo "ModelCapability NOT FOUND"

      - name: Build core
        run: |
          echo "Building core..."
          pnpm --filter @forge/core run build
          echo "Exit code: $?"

      - name: Build remaining
        run: pnpm --filter @forge/adapters run build && pnpm --filter @forge/cli run build

      - name: Verify contracts build
        run: |
          echo "=== Verifying contracts dist ==="
          ls -la packages/contracts/dist/
          cat packages/contracts/dist/index.d.ts 2>/dev/null | grep -A 5 "ModelCapability" || echo "ModelCapability NOT FOUND"

      - name: Test
        run: pnpm test